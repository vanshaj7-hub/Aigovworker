name: Android build (release APK)

# Manual trigger only — it will NOT run on every push, so it never quietly burns
# CI minutes. Run it from the GitHub "Actions" tab -> "Android build (release
# APK)" -> "Run workflow" when you want a fresh installable test build.
#
# Release (not debug) build: the JS bundle is compiled into the APK's assets,
# so it installs and runs standalone on a phone with no Metro dev server
# attached — a debug build instead loads its JS from `npx react-native start`
# over the network and shows "Unable to load script" without it. No release
# keystore is configured, so build.gradle's releaseSigningConfig falls back
# to the committed debug.keystore (see android/app/build.gradle) — fine for
# sideloading a test build, not for a Play Store release.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
